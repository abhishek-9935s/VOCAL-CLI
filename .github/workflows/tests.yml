name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m vocal.cli --help
      - run: python -m pip install .
      - name: Smoke test installed package outside the checkout
        run: python -c "import subprocess,sys,tempfile; subprocess.run([sys.executable, '-m', 'vocal', '--help'], cwd=tempfile.gettempdir(), check=True)"
